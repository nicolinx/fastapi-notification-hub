# Local stack: infrastructure plus the app, the worker, and a one-shot migration.

# Shared by migrate, app and worker. Inside Docker, "localhost" would mean the
# container itself, so the hosts are the service names: postgres and redis.
x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/notification_hub
  SYNC_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/notification_hub
  REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      # Dev-only credentials. They must match DATABASE_URL in .env.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notification_hub
    ports:
      # Bound to localhost only, so other machines on your network cannot connect.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notification_hub"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    image: notification-hub:dev
    command: alembic upgrade head
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    image: notification-hub:dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: .
    image: notification-hub:dev
    restart: unless-stopped
    command: celery -A src.workers.celery_app worker --loglevel=info
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
